name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/rms/browser

  deploy:
    needs: build
    if: github.event_name == 'push' && vars.YC_BUCKET != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.YC_REGION || 'kz1' }}
      ENDPOINT: ${{ vars.YC_STORAGE_ENDPOINT || 'https://storage.yandexcloud.kz' }}
      BUCKET: s3://${{ vars.YC_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Hashed bundles are immutable; index.html must always be revalidated.
      - run: >
          aws s3 sync dist "$BUCKET" --endpoint-url "$ENDPOINT" --delete
          --exclude index.html --cache-control "public, max-age=31536000, immutable"
      - run: >
          aws s3 cp dist/index.html "$BUCKET/index.html" --endpoint-url "$ENDPOINT"
          --cache-control "no-cache" --content-type "text/html; charset=utf-8"

  # Public demo on mock data: https://<owner>.github.io/<repo>/
  pages:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Pages has no SPA fallback: serve the app for unknown paths too.
      - run: cp dist/rms/browser/index.html dist/rms/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rms/browser
      - id: deploy
        uses: actions/deploy-pages@v4
